[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olapp"
dynamic = ["version"]
description = "A modern alternative to Gradio with stunning UI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Olapp Team", email = "hello@olapp.dev"},
]
keywords = ["gradio", "ui", "web", "ml", "machine-learning", "demo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiohttp>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.18",
]

[project.urls]
Homepage = "https://github.com/Atum246/olapp"
Documentation = "https://github.com/Atum246/olapp#readme"
Repository = "https://github.com/Atum246/olapp"
Issues = "https://github.com/Atum246/olapp/issues"

[tool.setuptools.dynamic]
version = {attr = "olapp.version.__version__"}

[tool.setuptools.packages.find]
include = ["olapp*"]

[tool.setuptools.package-data]
olapp = ["static/*.css", "static/*.js", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
